<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>재학습</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
</head>
<body>
<pre id="log">준비 중...</pre>
<script>
const SIZE = 224;          // Teachable Machine 입력 크기
const HIDDEN = 100;        // TM 기본 은닉 유닛 수

function post(path, body) {
  return fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify(body)}).catch(() => {});
}
const logEl = document.getElementById('log');
function log(msg) { logEl.textContent += '\n' + msg; post('/progress', {msg}); }

// @teachablemachine/image 의 cropTo() 와 동일한 전처리:
// 짧은 변 기준으로 비율 유지 축소 후 중앙 정사각 크롭.
const canvas = document.createElement('canvas');
canvas.width = canvas.height = SIZE;
const ctx = canvas.getContext('2d');
function toTensor(img) {
  const min = Math.min(img.width, img.height);
  const scale = SIZE / min;
  const w = Math.ceil(img.width * scale), h = Math.ceil(img.height * scale);
  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.drawImage(img, ~~((w - SIZE) / 2) * -1, ~~((h - SIZE) / 2) * -1, w, h);
  // capture(): 0-255 -> /127 - 1
  return tf.tidy(() =>
    tf.browser.fromPixels(canvas).expandDims(0).toFloat().div(tf.scalar(127)).sub(tf.scalar(1)));
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('이미지 로드 실패: ' + src));
    i.src = src;
  });
}

async function run() {
  const cfg = await (await fetch('/manifest.json')).json();
  const labels = cfg.classes.map(c => c.label);
  const N = labels.length;
  log(`클래스 ${N}개 / 이미지 ${cfg.classes.reduce((a, c) => a + c.images.length, 0)}장`);

  log('백본 로딩...');
  const base = await tf.loadLayersModel(cfg.baseModel);
  const backbone = base.layers[0];          // 잘라낸 MobileNetV2 + GlobalAveragePooling
  backbone.trainable = false;
  const featDim = backbone.outputShape[backbone.outputShape.length - 1];
  log(`백본 출력 차원 = ${featDim}`);

  // ---- 1) 전체 이미지를 임베딩으로 변환 (백본은 고정이라 한 번만 통과) ----
  const feats = [];
  const ys = [];
  let done = 0, failed = 0;
  for (let ci = 0; ci < N; ci++) {
    for (const url of cfg.classes[ci].images) {
      try {
        const img = await loadImage(url);
        const x = toTensor(img);
        const f = backbone.predict(x);
        feats.push(await f.data());
        ys.push(ci);
        x.dispose(); f.dispose();
      } catch (e) { failed++; }
      if (++done % 200 === 0) log(`  임베딩 ${done}장...`);
    }
  }
  log(`임베딩 완료: ${feats.length}장 (실패 ${failed}장)`);
  if (!feats.length) throw new Error('학습에 쓸 이미지가 없습니다.');

  // ---- 2) 셔플 (tfjs 의 validationSplit 은 뒤쪽을 잘라 쓰므로 반드시 필요) ----
  const idx = feats.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const M = idx.length;
  const xbuf = new Float32Array(M * featDim);
  const ybuf = new Float32Array(M * N);
  idx.forEach((src, k) => {
    xbuf.set(feats[src], k * featDim);
    ybuf[k * N + ys[src]] = 1;
  });
  const xs = tf.tensor2d(xbuf, [M, featDim]);
  const yt = tf.tensor2d(ybuf, [M, N]);

  // ---- 3) TM 과 동일한 헤드만 학습 ----
  const head = tf.sequential();
  head.add(tf.layers.dense({inputShape: [featDim], units: HIDDEN, activation: 'relu', useBias: true}));
  head.add(tf.layers.dense({units: N, activation: 'softmax', useBias: false}));
  head.compile({optimizer: tf.train.adam(cfg.learningRate),
                loss: 'categoricalCrossentropy', metrics: ['accuracy']});

  const valSplit = M > 20 ? cfg.valSplit : 0;
  log(`학습 시작: ${M}개 샘플, epochs=${cfg.epochs}, batch=${cfg.batchSize}, val=${valSplit}`);
  let trainAcc = 0, valAcc = 0;
  await head.fit(xs, yt, {
    epochs: cfg.epochs, batchSize: cfg.batchSize, shuffle: true, validationSplit: valSplit,
    callbacks: {
      onEpochEnd: async (e, logs) => {
        trainAcc = logs.acc !== undefined ? logs.acc : logs.accuracy;
        valAcc = logs.val_acc !== undefined ? logs.val_acc : (logs.val_accuracy || 0);
        if ((e + 1) % 5 === 0 || e === cfg.epochs - 1)
          log(`  epoch ${e + 1}/${cfg.epochs}  loss=${logs.loss.toFixed(4)} acc=${trainAcc.toFixed(3)} val_acc=${(valAcc || 0).toFixed(3)}`);
        await tf.nextFrame();
      }
    }
  });
  xs.dispose(); yt.dispose();

  // ---- 4) 백본 + 새 헤드를 하나로 묶어 TM 과 같은 구조로 저장 ----
  const combined = tf.sequential();
  combined.add(backbone);
  combined.add(head);

  let artifacts = null;
  await combined.save(tf.io.withSaveHandler(async a => {
    artifacts = a;
    return {modelArtifactsInfo: {dateSaved: new Date(), modelTopologyType: 'JSON'}};
  }));

  const bytes = new Uint8Array(artifacts.weightData);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

  log('저장 전송 중...');
  await post('/save', {
    labels, trainAcc, valAcc,
    artifacts: {
      modelTopology: artifacts.modelTopology,
      weightSpecs: artifacts.weightSpecs,
      weightData: btoa(bin)
    }
  });
  log('완료');
}

run().catch(async e => {
  log('오류: ' + (e && (e.stack || e.message)));
  await post('/error', {error: String(e && (e.message || e))});
});
</script>
</body>
</html>
