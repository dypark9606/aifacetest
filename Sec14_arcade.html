<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<title>얼굴상 오락실</title>
<link href="https://fonts.googleapis.com/css?family=Jua&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#12102a;--card:#1d1a3d;--line:#332f63;--hot:#ff4d6d;--go:#25d07a;--gold:#ffd166;--ink:#f3f0ff}
  *{box-sizing:border-box}
  body{margin:0;padding:0 0 40px;font-family:'Jua',-apple-system,'Malgun Gothic',sans-serif;
       background:linear-gradient(180deg,#12102a,#1b1640);color:var(--ink);-webkit-tap-highlight-color:transparent}
  .wrap{max-width:760px;margin:0 auto;padding:14px}
  h1{font-size:34px;text-align:center;margin:8px 0 2px;color:var(--gold)}
  .lead{text-align:center;font-size:18px;margin:0 0 12px;opacity:.85}
  .coins{text-align:center;font-size:20px;color:var(--gold);margin-bottom:5px}
  .economy{text-align:center;font-size:15px;opacity:.82;margin:0 0 10px}
  .notice{text-align:center;font-size:19px;color:var(--gold);margin:5px 0 10px}

  .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
  .card h2{font-size:22px;margin:0 0 10px;color:var(--gold)}

  .picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .gbtn{font-family:inherit;font-size:17px;padding:14px 8px;border-radius:16px;cursor:pointer;
        border:2px solid var(--line);background:#241f4d;color:var(--ink);text-align:center;line-height:1.35}
  .gbtn[aria-pressed="true"]{background:var(--hot);border-color:var(--hot)}
  .gbtn .e{display:block;font-size:30px}
  .gbtn .b{display:block;font-size:14px;opacity:.8}

  .hud{display:flex;justify-content:space-around;font-size:20px;margin-bottom:8px}
  .hud b{color:var(--gold)}
  .field{position:relative;width:100%;height:340px;border-radius:16px;overflow:hidden;
         background:#0d0b20;border:2px solid var(--line);touch-action:manipulation;user-select:none}
  .field.tap{cursor:pointer}
  .hole{position:absolute;width:72px;height:72px;border-radius:50%;background:#2b2559;
        display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;
        touch-action:none;-webkit-user-select:none;user-select:none}
  .hole.up{background:#3b8f5a}
  /* ⚠ 히트 영역. 이모지 글리프만으로는 30px 도 안 돼서 폰에서 거의 안 잡혔다.
     손가락 터치 목표는 최소 56~64px 다. flex 로 가운데 정렬해 글자는 그대로 두고
     **누를 수 있는 판만** 키운다. touch-action:none 은 탭이 스크롤로 먹히는 걸 막는다. */
  .target{position:absolute;font-size:34px;cursor:pointer;will-change:transform;
          min-width:64px;min-height:64px;display:flex;align-items:center;justify-content:center;
          touch-action:none;-webkit-user-select:none;user-select:none;
          margin-left:-32px;margin-top:-32px}
  /* 맞은 까마귀: 회전하며 떨어진다 */
  .target.dead{animation:crowfall .52s ease-in forwards;pointer-events:none}
  @keyframes crowfall{
    0%{transform:scale(1.35) rotate(0deg);opacity:1}
    100%{transform:translateY(90px) scale(.7) rotate(160deg);opacity:0}
  }
  /* 맞았을 때 뜨는 "+1" / "꽥!" */
  .hit-pop{position:absolute;font-size:23px;font-weight:bold;color:#ffd166;
           pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);
           animation:pop .62s ease-out forwards;z-index:5}
  @keyframes pop{
    0%{transform:translateY(0) scale(.7);opacity:0}
    25%{transform:translateY(-14px) scale(1.25);opacity:1}
    100%{transform:translateY(-52px) scale(1);opacity:0}
  }
  /* 잡힌 두꺼비: 납작해진다 */
  .hole.squish{background:#b8532a;animation:squish .38s ease-out}
  @keyframes squish{
    0%{transform:scale(1)}
    40%{transform:scale(1.2,.7)}
    100%{transform:scale(1)}
  }
  .reflex-pad{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
              font-size:26px;text-align:center;padding:16px}
  .reflex-pad.wait{background:#8a2036}.reflex-pad.go{background:#1a7a4a}
  .bar{position:absolute;left:8%;right:8%;bottom:22px;height:26px;border-radius:99px;background:#2b2559;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#25d07a,#ffd166,#ff4d6d)}
  /* 판자 뚫기 무대: 나무판 4장을 세로로 세워 나란히 놓는다 */
  .boards{position:absolute;left:0;right:0;top:56px;height:150px;
          display:flex;align-items:center;justify-content:center;gap:15px}
  .plank{position:relative;width:26px;height:118px;border-radius:4px;
         background:linear-gradient(180deg,#c98d4e,#9c6330);
         box-shadow:inset 0 0 0 2px rgba(0,0,0,.22), 0 4px 10px rgba(0,0,0,.35)}
  /* 나뭇결 */
  .plank::after{content:'';position:absolute;inset:6px 4px;border-radius:2px;
                background:repeating-linear-gradient(180deg,
                  rgba(0,0,0,.10) 0 2px, transparent 2px 13px)}
  /* 쪼개진 판자: 위아래 두 조각이 갈라져 날아간다 */
  .plank-top,.plank-bot{position:absolute;left:0;right:0;border-radius:4px;
        background:linear-gradient(180deg,#c98d4e,#9c6330);opacity:0}
  .plank-top{top:0;height:50%}
  .plank-bot{bottom:0;height:50%}
  .plank.broken{background:transparent;box-shadow:none}
  .plank.broken::after{opacity:0}
  .plank.broken .plank-top{opacity:1;animation:plankbreak .42s ease-out forwards}
  .plank.broken .plank-bot{opacity:1;animation:plankbreak .42s ease-out forwards;
                           animation-direction:reverse}
  @keyframes plankbreak{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translateY(-58px) rotate(-38deg);opacity:0}
  }
  /* 날아가는 화살.
     ⚠ top 을 임의 고정값으로 두면 판자 높이를 바꿀 때 화살이 판자를 비켜 간다.
     .boards(top:56px, height:150px)의 세로 중앙 = 56 + 75 = 131px 에 맞춘다.
     transform:translateY(-50%) 로 글리프 중심을 그 선에 올린다. */
  .arrow-fly{position:absolute;left:2%;top:131px;font-size:30px;z-index:6;
             pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  @keyframes arrowfly{
    0%{transform:translate(0,-50%) scale(.85);opacity:0}
    12%{opacity:1}
    100%{transform:translate(var(--dist,50%),-50%) scale(1.05);opacity:1}
  }

  .actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:10px}
  .btn{font-family:inherit;font-size:19px;padding:11px 18px;border-radius:999px;border:none;cursor:pointer;
       background:var(--hot);color:#fff}
  .btn.go{background:var(--go)}
  .btn.sub{background:#2a2456;color:var(--ink);border:2px solid var(--line)}
  .btn.coin{background:#e3a52c;color:#201900}

  .score-big{font-size:44px;text-align:center;color:var(--gold);margin:6px 0}
  .tier{text-align:center;font-size:22px;margin-bottom:6px}
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
  .vs .pt{font-size:32px;color:var(--gold)}.vs .mid{font-size:24px}
  .banner{text-align:center;font-size:25px;margin:8px 0;color:var(--gold)}
  .board{list-style:none;margin:0;padding:0}
  .board li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:18px}
  .link-box{width:100%;font-family:inherit;font-size:14px;padding:9px;border-radius:10px;border:2px solid var(--line);
            background:#0d0b20;color:var(--ink);min-height:64px}
  .hint{font-size:15px;opacity:.75;text-align:center;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🕹️ 얼굴상 오락실</h1>
  <p class="lead" id="cost-lead">한 판 5코인! 잘할수록 코인을 더 받아요</p>
  <p class="coins">🪙 내 코인 <b id="coin-count">0</b></p>
  <p class="economy">매일 첫 접속 +100 · 얼굴 테스트 1회 +5 · C급 +2 · B급 +6 · A급 +12 · S급 +20 · 신기록 +5</p>
  <p class="notice hidden" id="daily-notice"></p>
  <div class="actions" style="margin:0 0 12px"><button class="btn coin" id="ask-coins">🎁 친구에게 코인 받기</button></div>

  <div class="card hidden" id="challenge-card">
    <h2>📨 도전장 도착</h2>
    <p id="challenge-text" style="font-size:18px;margin:0"></p>
  </div>

  <div class="card hidden" id="coin-card">
    <h2 id="coin-title">🪙 코인이 부족해요</h2>
    <p id="coin-text" style="font-size:18px;margin:0 0 8px"></p>
    <div class="actions">
      <button class="btn coin hidden" id="send-coins">🎁 30코인 보내기</button>
      <button class="btn" id="share-coin-request">💬 친구에게 요청 보내기</button>
    </div>
  </div>

  <div class="card">
    <h2>게임 고르기</h2>
    <div class="picker" id="picker"></div>
    <p class="hint" id="game-desc"></p>
  </div>

  <div class="card">
    <div class="hud">
      <span>점수 <b id="hud-score">0</b></span>
      <span>남은시간 <b id="hud-time">–</b></span>
      <span id="hud-level-wrap" class="hidden">단계 <b id="hud-level">1단계</b></span>
      <span>최고 <b id="hud-best">–</b></span>
    </div>
    <div class="field" id="field"></div>
    <div class="actions">
      <button class="btn go" id="start">▶ 시작</button>
      <button class="btn sub" id="reset-all">↩️ 처음부터 다시 하기</button>
    </div>
  </div>

  <div class="card hidden" id="result-card">
    <h2>결과</h2>
    <p class="score-big" id="score-big">0</p>
    <p class="tier" id="tier"></p>
    <p class="hint" id="coin-msg"></p>
    <div class="actions">
      <button class="btn go" id="again">🔁 한 번 더</button>
      <button class="btn" id="make-challenge">📨 도전장 보내기</button>
      <button class="btn sub" id="share-result">💬 결과 친구에게 공유</button>
      <button class="btn sub" id="insta-card">📸 인스타 카드</button>
    </div>
  </div>

  <div class="card hidden" id="battle-card">
    <h2>⚔️ 대결 결과</h2>
    <div class="vs">
      <div><div id="vs-left-name">친구</div><div class="pt" id="vs-left">0</div></div>
      <div class="mid">VS</div>
      <div><div>나</div><div class="pt" id="vs-right">0</div></div>
    </div>
    <p class="banner" id="battle-banner"></p>
    <div class="actions">
      <button class="btn" id="share-battle">💬 대결 결과 공유</button>
    </div>
  </div>

  <div class="card hidden" id="link-card">
    <h2>📨 도전장 링크</h2>
    <textarea class="link-box" id="link-out" readonly></textarea>
    <div class="actions">
      <button class="btn" id="send-challenge">💬 메시지로 보내기</button>
      <button class="btn sub" id="copy-link">📋 복사</button>
    </div>
  </div>

  <div class="card">
    <h2>🏅 내 최고기록</h2>
    <ul class="board" id="board"></ul>
  </div>
</div>

<script src="js/coin-wallet.js"></script>
<script src="js/arcade-core.js"></script>
<script src="js/share-card.js"></script>
<script src="js/arcade-games.js"></script>
<script>
(function () {
  'use strict';
  var A = window.Arcade, GAMES = window.ArcadeGames;
  var $ = function (id) { return document.getElementById(id); };
  var state = { id: 'mole', last: null, challenge: null, running: null, coinRequest: null };

  function baseUrl() {
    try { if (window.top !== window.self && document.referrer) return document.referrer.split(/[?#]/)[0]; }
    catch (e) {}
    return location.href.split(/[?#]/)[0];
  }

  function arcadeUrl() { return location.href.split(/[?#]/)[0]; }
  function showCoinCard(title, text, canSend) {
    $('coin-title').textContent = title;
    $('coin-text').textContent = text;
    $('send-coins').classList.toggle('hidden', !canSend);
    $('share-coin-request').classList.toggle('hidden', !!canSend);
    $('coin-card').classList.remove('hidden');
  }
  function shareCoinMessage(text, url) {
    var msg = text + '\n' + url + '\n📱 앱 설치: https://play.google.com/store/apps/details?id=com.dypark9606.aifacetest';
    if (navigator.share) { navigator.share({title:'얼굴상 오락실 코인',text:msg}).catch(function(){}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(msg).then(
      function(){ alert('코인 메시지를 복사했어요. 친구에게 보내세요!'); },
      function(){ prompt('복사해서 친구에게 보내세요',msg); });
    else prompt('복사해서 친구에게 보내세요',msg);
  }
  function askCoins() {
    var name = prompt('친구에게 보일 이름', '나') || '나';
    var tok = A.createCoinRequest(name);
    shareCoinMessage('🪙 '+name+'님이 게임 코인이 필요해요. 30코인을 보내주세요!', arcadeUrl()+'?coinRequest='+tok);
  }

  function drawPicker() {
    var box = $('picker'); box.innerHTML = '';
    A.GAMES.forEach(function (g) {
      var best = A.getBest(g.id);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gbtn';
      b.setAttribute('aria-pressed', String(g.id === state.id));
      b.innerHTML = '<span class="e">' + g.emoji + '</span>' + g.name +
        '<span class="b">최고 ' + (best === null ? '–' : A.scoreText(g.id, best)) + '</span>';
      b.addEventListener('click', function () {
        /* 지겨워지면 바로 다른 게임으로 — 진행 중이어도 즉시 갈아탄다.
           ⚠ 이전 판의 타이머를 반드시 먼저 끊는다. 안 끊으면 새 게임 중에
           옛 판의 onEnd 가 터져 엉뚱한 점수가 기록된다. */
        if (state.running && state.running.stop) state.running.stop();
        state.running = null; state.last = null;
        state.id = g.id; drawPicker(); drawHud(); clearField();
        $('result-card').classList.add('hidden');
        $('battle-card').classList.add('hidden');
        $('link-card').classList.add('hidden');
        start();   /* 누르는 순간 그 게임이 시작된다 */
      });
      box.appendChild(b);
    });
    $('game-desc').textContent = A.game(state.id).desc;
  }

  function drawHud() {
    var best = A.getBest(state.id);
    $('hud-best').textContent = best === null ? '–' : A.scoreText(state.id, best);
    $('hud-score').textContent = '0';
    $('hud-time').textContent = '–';
    /* 게임을 바꾸면 단계 표시는 숨긴다 (두꺼비 전용) */
    $('hud-level-wrap').classList.add('hidden');
    $('hud-level').textContent = '1단계';
    $('coin-count').textContent = A.getCoins();
    /* ⚠ 한 판 값을 HTML 에 하드코딩하면 상수를 바꿔도 안내가 옛 값으로 남는다.
       (실제로 10 -> 5 로 내렸을 때 "한 판 10코인" 이 그대로 있었다) */
    $('cost-lead').textContent =
      '한 판 ' + A.GAME_COST + '코인! 잘할수록 코인을 더 받아요';
  }

  function drawBoard() {
    var ul = $('board'); ul.innerHTML = '';
    A.GAMES.forEach(function (g) {
      var best = A.getBest(g.id);
      var li = document.createElement('li');
      li.innerHTML = '<span>' + g.emoji + ' ' + g.name + '</span><b>' +
        (best === null ? '기록 없음' : A.scoreText(g.id, best) + ' · ' + A.rank(g.id, best).tier) + '</b>';
      ul.appendChild(li);
    });
  }

  function clearField() { $('field').innerHTML = ''; $('field').className = 'field'; }

  function finish(score) {
    state.running = null;
    var isBest = A.saveBest(state.id, score);
    var got = A.coins(state.id, score, isBest);
    A.addCoins(got);
    state.last = score;
    $('score-big').textContent = A.scoreText(state.id, score);
    var r = A.rank(state.id, score);
    /* 0점을 "신기록"이라고 축하하면 장난처럼 보인다. 첫 기록이어도 알리지 않는다. */
    var celebrate = isBest && score > 0;
    $('tier').textContent = r.tier + '급 · ' + r.text + (celebrate ? '  🎉 신기록!' : '');
    $('coin-msg').textContent = '🪙 입장 -' + A.GAME_COST + ' · 보상 +' + got +
      (celebrate ? ' (신기록 +5 포함)' : '') + ' · 현재 ' + A.getCoins() + '코인';
    $('result-card').classList.remove('hidden');
    drawPicker(); drawHud(); drawBoard();
    if (state.challenge && state.challenge.game === state.id) showBattle(score);
    $('result-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showBattle(mine) {
    var c = state.challenge, j = A.judge(state.id, mine, c.score);
    $('vs-left-name').textContent = c.name;
    $('vs-left').textContent = A.scoreText(c.game, c.score);
    $('vs-right').textContent = A.scoreText(state.id, mine);
    $('battle-banner').textContent = j.emoji + ' ' + j.label;
    $('battle-card').classList.remove('hidden');
  }

  function start() {
    if (state.running) return;
    if (A.spendGame() === false) {
      showCoinCard('🪙 코인이 부족해요',
        '한 판에 '+A.GAME_COST+'코인이 필요합니다. 위쪽 탭에서 얼굴 테스트(외모점수·동물상·사주·MBTI 등)를 하면 한 번에 '+A.ANALYSIS_REWARD+'코인을 받아요. 친구에게 30코인을 요청할 수도 있어요.', false);
      drawHud(); return false;
    }
    $('coin-card').classList.add('hidden');
    $('coin-count').textContent = A.getCoins();
    $('result-card').classList.add('hidden');
    $('link-card').classList.add('hidden');
    clearField();
    state.running = GAMES[state.id]({
      field: $('field'),
      onScore: function (s) { $('hud-score').textContent = s; },
      onTime: function (t) { $('hud-time').textContent = t; },
      /* 두꺼비만 단계가 오른다. 다른 게임에선 이 칸을 숨긴다. */
      onLevel: function (label) {
        $('hud-level').textContent = label;
        $('hud-level-wrap').classList.remove('hidden');
      },
      onEnd: finish
    });
    return true;
  }

  function resultText() {
    var g = A.game(state.id), r = A.rank(state.id, state.last);
    return g.emoji + ' ' + g.name + ' ' + A.scoreText(state.id, state.last) +
      ' — ' + r.tier + '급 ' + r.text + '\n너도 해봐!';
  }

  function shareText(text) {
    /* 받는 친구는 앱이 없다 — 설치 링크를 항상 같이 보낸다. */
    var full = window.ShareCard
      ? window.ShareCard.shareMessage({ title: '🕹️ 얼굴상 오락실', body: text, url: baseUrl() })
      : text + '\n' + baseUrl();
    if (navigator.share) { navigator.share({ title: '얼굴상 오락실', text: full }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(full).then(
      function () { alert('복사했어요! 친구에게 붙여넣기 하세요.'); },
      function () { prompt('복사해서 보내세요', full); });
    else prompt('복사해서 보내세요', full);
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('ask-coins').addEventListener('click', askCoins);
  $('share-coin-request').addEventListener('click', askCoins);
  $('send-coins').addEventListener('click', function () {
    if (!state.coinRequest) return;
    var gift = A.createCoinGift(state.coinRequest);
    if (!gift) {
      showCoinCard('🪙 보낼 코인이 부족해요', '30코인이 있어야 친구에게 보낼 수 있습니다.', false);
      drawHud(); return;
    }
    drawHud(); $('coin-card').classList.add('hidden');
    shareCoinMessage('🎁 ' + state.coinRequest.name + '님에게 30코인을 보냈어요! 아래 링크를 열면 받아요.',
      arcadeUrl() + '?coinGift=' + gift);
  });
  $('share-result').addEventListener('click', function () { if (state.last !== null) shareText(resultText()); });
  $('share-battle').addEventListener('click', function () {
    if (state.last === null || !state.challenge) return;
    var j = A.judge(state.id, state.last, state.challenge.score);
    shareText('⚔️ ' + A.game(state.id).name + '\n' + state.challenge.name + ' ' +
      A.scoreText(state.challenge.game, state.challenge.score) + ' VS 나 ' +
      A.scoreText(state.id, state.last) + ' — ' + j.label);
  });
  $('make-challenge').addEventListener('click', function () {
    if (state.last === null) return;
    var name = prompt('도전자 이름', '나') || '나';
    var tok = A.encode(A.challenge(name, state.id, state.last));
    $('link-out').value = location.href.split(/[?#]/)[0] + '?arcade=' + tok;
    $('link-card').classList.remove('hidden');
    $('link-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('send-challenge').addEventListener('click', function () {
    var url = $('link-out').value;
    var msg = window.ShareCard ? window.ShareCard.shareMessage({
      title: '🕹️ ' + A.game(state.id).name + ' 도전장!',
      body: '내 기록 ' + A.scoreText(state.id, state.last) + ' — 이길 수 있어?',
      url: url, challenge: true
    }) : url;
    if (navigator.share) { navigator.share({ title: '오락실 도전장', text: msg }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(msg).then(
      function () { alert('도전장을 복사했어요! 설치 링크도 같이 들어 있어요.'); },
      function () { prompt('복사해서 보내세요', msg); });
    else prompt('복사해서 보내세요', msg);
  });
  $('copy-link').addEventListener('click', function () {
    var url = $('link-out').value;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(
      function () { alert('링크를 복사했어요!'); }, function () { prompt('복사해서 보내세요', url); });
    else prompt('복사해서 보내세요', url);
  });
  $('insta-card').addEventListener('click', function () {
    if (state.last === null || !window.ShareCard) return;
    var g = A.game(state.id), r = A.rank(state.id, state.last);
    var C = window.ShareCard;
    var opts = { size: 'story', theme: g.emoji + ' ' + g.name,
                 heading: '🕹️ 얼굴상 오락실',
                 score: state.last, scoreLabel: A.scoreText(state.id, state.last),
                 verdict: r.tier + '급 · ' + r.text };
    if (state.challenge && state.challenge.game === state.id)
      opts.opponent = { name: state.challenge.name, score: state.challenge.score,
                        label: A.scoreText(state.challenge.game, state.challenge.score) };
    C.drawCard(opts).then(function (o) { return C.shareImage(o.blob, C.instaCaption(opts)); })
      .then(function (how) {
        $('coin-msg').textContent = how === 'shared'
          ? '공유 시트에서 Instagram 을 고르세요.'
          : '카드를 저장했어요. 캡션도 복사됐습니다.';
      }).catch(function () {});
  });

  /* 처음부터 다시 하기 — 진행 중인 판을 멈추고 화면을 초기 상태로 */
  $('reset-all').addEventListener('click', function () {
    if (state.running && state.running.stop) state.running.stop();
    state.running = null; state.last = null;
    clearField(); drawHud(); drawPicker();
    $('result-card').classList.add('hidden');
    $('battle-card').classList.add('hidden');
    $('link-card').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  (function boot() {
    var daily = A.ensureDaily();
    if (daily.granted) {
      $('daily-notice').textContent = '🎁 오늘의 코인 +' + daily.granted + ' 지급!';
      $('daily-notice').classList.remove('hidden');
    }

    var giftMatch = /[?&]coinGift=([A-Za-z0-9_-]+)/.exec(location.search);
    if (giftMatch) {
      var claimed = A.claimCoinGift(giftMatch[1]);
      $('daily-notice').textContent = claimed.ok
        ? '🎁 친구에게서 ' + claimed.amount + '코인을 받았어요!'
        : (claimed.reason === 'claimed' ? '이 코인 선물은 이미 받았습니다.' : '유효하지 않은 코인 선물입니다.');
      $('daily-notice').classList.remove('hidden');
    }

    var requestMatch = /[?&]coinRequest=([A-Za-z0-9_-]+)/.exec(location.search);
    if (requestMatch) {
      var request = A.decodeCoinToken(requestMatch[1]);
      if (request && request.kind === 'request') {
        state.coinRequest = request;
        showCoinCard('🎁 친구의 코인 요청', request.name + '님에게 30코인을 보내시겠어요? 내 코인에서 30개가 차감됩니다.', true);
      }
    }

    var m = /[?&]arcade=([A-Za-z0-9_-]+)/.exec(location.search);
    if (m) {
      var c = A.decode(m[1]);
      if (c) {
        state.challenge = c; state.id = c.game;
        $('challenge-card').classList.remove('hidden');
        $('challenge-text').textContent = c.name + '님이 ' + A.game(c.game).name + '에서 ' +
          A.scoreText(c.game, c.score) + ' 기록! 이겨보세요.';
      }
    }
    drawPicker(); drawHud(); drawBoard();
  })();

  window.__shareResultText = function () { return state.last === null ? '' : resultText(); };
  window.__arcadeState = state;
})();
</script>
</body>
</html>
