		<!------------------------------ 여기는 codepen 자바스트립트 ---------------------------->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.transit/0.9.12/jquery.transit.min.js"></script>
		<!------------------------------ 여기는 codepen 자바스트립트 ---------------------------->

		<!------------------------------ Tab 관련 Javascript----------------------------------->
		<script>
			var Tabs = (function ($) {
				return {
					init: function () {
						this.cacheDom();
						this.setupAria();
						this.appendIndicator();
						this.placeIndicator();
						this.bindEvents();
					},

					cacheDom: function () {
						this.$el = $('.tabs');
						this.$tabList = this.$el.find('ul');
						this.$tab = this.$tabList.find('li');
						this.$tabFirst = this.$tabList.find('li:first-child a');
						this.$tabLink = this.$tab.find('a');
						this.$tabPanel = this.$el.find('section');
						this.$tabPanelFirstContent = this.$el.find('section > *:first-child');
						this.$tabPanelFirst = this.$el.find('section:first-child');
						this.$tabPanelNotFirst = this.$el.find('section:not(:first-of-type)');
					},

					bindEvents: function () {
						this.$tabLink.on(
							'click',
							function () {
								this.changeTab();
								this.animateIndicator($(event.currentTarget));
							}.bind(this)
						);
						this.$tabLink.on(
							'keydown',
							function () {
								this.changeTabKey();
							}.bind(this)
						);
						$(window).on(
							'resize',
							function () {
								this.placeIndicator();
							}.bind(this)
						);
					},

					changeTab: function () {
						var self = $(event.target);
						event.preventDefault();
						this.removeTabFocus();
						this.setSelectedTab(self);
						this.hideAllTabPanels();
						this.setSelectedTabPanel(self);
					},

					// 탭이 2줄이라 가로 위치만으로는 부족하다. 세로 위치도 같이 옮긴다
					animateIndicator: function (elem, instant) {
						var $ul = this.$tabList;
						var ulOffset = $ul.offset();
						var offset = elem.offset();
						var $indicator = $ul.find('.indicator');
						var pos = {
							x: offset.left - ulOffset.left,
							y: offset.top - ulOffset.top + elem.outerHeight() - 3,
							width: elem.width(),
						};

						if (instant) {
							$indicator.css(pos);
						} else {
							$indicator.transition(pos);
						}
					},

					// 첫 진입 때와 화면 크기가 바뀔 때 선택된 탭 밑으로 붙여 준다
					placeIndicator: function () {
						var $selected = this.$tabList.find('a[aria-selected]');

						if ($selected.length) {
							this.animateIndicator($selected, true);
						}
					},

					appendIndicator: function () {
						this.$tabList.append('<div class="indicator"></div>');
					},

					changeTabKey: function () {
						var self = $(event.target),
							$target = this.setKeyboardDirection(self, event.keyCode);

						if ($target.length) {
							this.removeTabFocus(self);
							this.setSelectedTab($target);
						}
						this.hideAllTabPanels();
						this.setSelectedTabPanel($(document.activeElement));
						this.animateIndicator($target);
					},

					hideAllTabPanels: function () {
						this.$tabPanel.attr('aria-hidden', 'true');
					},

					removeTabFocus: function (self) {
						var $this = self || $('[role="tab"]');

						$this.attr({
							tabindex: '-1',
							'aria-selected': null,
						});
					},

					selectFirstTab: function () {
						this.$tabFirst.attr({
							'aria-selected': 'true',
							tabindex: '0',
						});
					},

					setupAria: function () {
						this.$tabList.attr('role', 'tablist');
						this.$tab.attr('role', 'presentation');
						this.$tabLink.attr({
							role: 'tab',
							tabindex: '-1',
						});
						this.$tabLink.each(function () {
							var $this = $(this);

							$this.attr('aria-controls', $this.attr('href').substring(1));
						});
						this.$tabPanel.attr({
							role: 'tabpanel',
						});
						this.$tabPanelFirstContent.attr({
							tabindex: '0',
						});
						this.$tabPanelNotFirst.attr({
							'aria-hidden': 'true',
						});
						this.selectFirstTab();
					},

					setKeyboardDirection: function (self, keycode) {
						var $prev = self.parents('li').prev().children('[role="tab"]'),
							$next = self.parents('li').next().children('[role="tab"]');

						switch (keycode) {
							case 37:
								return $prev;
								break;
							case 39:
								return $next;
								break;
							default:
								return false;
								break;
						}
					},

					setSelectedTab: function (self) {
						self.attr({
							'aria-selected': true,
							tabindex: '0',
						}).focus();
					},

					setSelectedTabPanel: function (self) {
						$('#' + self.attr('href').substring(1)).attr('aria-hidden', null);
					},
				};
			})(jQuery);

			Tabs.init();
		</script>
		<!------------------------------ Tab 관련 Javascript------------------------------------------>
